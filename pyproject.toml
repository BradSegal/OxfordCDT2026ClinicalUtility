[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdt-clinical-utility"
version = "0.1.0"
description = "Clinical decisions from simulated ECG model scores: a Colab teaching practical"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "plotly>=5.18", "ipywidgets>=8"]
authors = [{name = "Bradley Segal"}]
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_utility = ["assets/*"]
